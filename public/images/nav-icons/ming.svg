<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a853"/>
      <stop offset="1" stop-color="#8a5a1a"/>
    </linearGradient>
    <linearGradient id="sym" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7e6"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#5a3a0e" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#bg)" filter="url(#ds)"/>
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#gloss)"/>
  <rect x="5" y="5" width="38" height="38" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <!-- 毛笔笔杆 -->
  <rect x="27" y="13" width="3.5" height="14" rx="1.2" fill="url(#sym)"/>
  <!-- 毛笔笔头（毛） -->
  <path d="M26.2 26.5 L31.3 26.5 L30 33 L27.5 33 Z" fill="url(#sym)"/>
  <!-- 笔尖 -->
  <path d="M28.3 32.5 L29.5 32.5 L28.9 36 L28.9 36 Z" fill="#8a5a1a"/>
  <!-- 墨迹"名"字抽象 -->
  <circle cx="18" cy="20" r="3.5" fill="url(#sym)" opacity="0.9"/>
  <rect x="16" y="25" width="8" height="3" rx="1.2" fill="url(#sym)"/>
  <rect x="15.5" y="30" width="9" height="3" rx="1.2" fill="url(#sym)"/>
  <!-- 墨点装饰 -->
  <circle cx="13" cy="35" r="1.6" fill="url(#sym)" opacity="0.7"/>
  <circle cx="35" cy="37" r="1.1" fill="url(#sym)" opacity="0.55"/>
</svg>
